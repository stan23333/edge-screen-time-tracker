<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Behavior Analysis</title>
    <link rel="stylesheet" href="analysis.css">
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <p class="eyebrow">Web Screen Time Tracker</p>
          <h1>Analysis</h1>
        </div>
        <nav>
          <a href="../dashboard/dashboard.html">Dashboard</a>
          <a href="../records/records.html">Records</a>
          <a href="../settings/settings.html">Settings</a>
        </nav>
      </header>

      <section class="controls panel">
        <input id="endDate" type="date">
        <button data-period="day" type="button">Analyze Day</button>
        <button data-period="week" type="button">Analyze Week</button>
        <button data-period="month" type="button">Analyze Month</button>
      </section>

      <section class="metrics">
        <article class="metricCard blue">
          <span>Reports</span>
          <strong id="reportCount">0</strong>
        </article>
        <article class="metricCard green">
          <span>Summaries</span>
          <strong id="summaryCount">0</strong>
        </article>
        <article class="metricCard purple">
          <span>LLM tokens</span>
          <strong id="tokenCount">0</strong>
        </article>
        <article class="metricCard peach">
          <span>Errors</span>
          <strong id="errorCount">0</strong>
        </article>
      </section>

      <section class="insightGrid">
        <article class="panel">
          <div class="sectionTop">
            <div>
              <p class="eyebrow">Content types</p>
              <h2>Summary distribution</h2>
            </div>
          </div>
          <div id="contentTypes" class="pillGrid"></div>
        </article>
        <article class="panel">
          <div class="sectionTop">
            <div>
              <p class="eyebrow">Topics</p>
              <h2>Frequent themes</h2>
            </div>
          </div>
          <div id="topicList" class="topicList"></div>
        </article>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>Reports</h2>
          <div id="reportList" class="reportList"></div>
        </aside>
        <article class="panel reportPanel">
          <div class="reportHeader">
            <div>
              <p class="eyebrow" id="reportMeta">No report selected</p>
              <h2 id="reportTitle">Behavior Summary</h2>
            </div>
            <span id="reportUsage" class="usagePill">Tokens not reported</span>
          </div>
          <pre id="reportBody">Generate or select a report.</pre>
        </article>
      </section>
    </main>
    <script src="../utils/time.js"></script>
    <script src="analysis.js"></script>
  </body>
</html>
